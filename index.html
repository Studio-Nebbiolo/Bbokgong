<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뽁뽁이 10×10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-center:#EEF1F5; --bg-edge:#CBD2DC;
  --ink:#1D2633; --ink-2:rgba(29,38,51,.58); --ink-3:rgba(29,38,51,.32);
  --glass:rgba(255,255,255,.52); --glass-line:rgba(255,255,255,.75); --glass-shadow:0 10px 30px rgba(40,56,80,.12), 0 1px 0 rgba(255,255,255,.6) inset;
  --seg-active:#FFFFFF; --air:#3E7BFA; --warn:#F0525A; --track:rgba(29,38,51,.12);
  --fx-mist:#FFFFFF; --fx-ring:#FFFFFF; --fx-spark:#FFFFFF; --shadow-op:.20;
  --env-top:#F7F9FC; --env-mid:#E3E7ED; --env-bottom:#CDD3DC; --box:3.0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-center:#2A313C; --bg-edge:#151A21;
    --ink:#E8EDF4; --ink-2:rgba(232,237,244,.62); --ink-3:rgba(232,237,244,.3);
    --glass:rgba(34,41,52,.55); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.06) inset;
    --seg-active:rgba(255,255,255,.14); --air:#7FA8FF; --warn:#FF7178; --track:rgba(255,255,255,.12);
    --fx-mist:#CFE0FF; --fx-ring:#BFD4FF; --fx-spark:#FFFFFF; --shadow-op:.45;
    --env-top:#5A6576; --env-mid:#262D38; --env-bottom:#10141A; --box:4.2;
  }
}
:root[data-theme="dark"]{
  --bg-center:#2A313C; --bg-edge:#151A21;
  --ink:#E8EDF4; --ink-2:rgba(232,237,244,.62); --ink-3:rgba(232,237,244,.3);
  --glass:rgba(34,41,52,.55); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.06) inset;
  --seg-active:rgba(255,255,255,.14); --air:#7FA8FF; --warn:#FF7178; --track:rgba(255,255,255,.12);
  --fx-mist:#CFE0FF; --fx-ring:#BFD4FF; --fx-spark:#FFFFFF; --shadow-op:.45;
  --env-top:#5A6576; --env-mid:#262D38; --env-bottom:#10141A; --box:4.2;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;background:var(--bg-edge);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#scene.can-grab{cursor:grab} #scene.grabbing{cursor:grabbing} #scene.can-press{cursor:pointer}

.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 22px 0;pointer-events:none}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.count{font-size:13.5px;color:var(--ink-2);font-weight:400;font-variant-numeric:tabular-nums}
.count.total{font-size:12px;color:var(--ink-3)}
.count b{font-weight:500;color:var(--ink);display:inline-block}
.count b.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.5)}100%{transform:scale(1)}}

.meters{width:min(220px,44vw);display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:18px;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.meter{display:grid;grid-template-columns:1fr auto;row-gap:6px;font-size:12.5px}
.meter span{color:var(--ink-2)}
.meter output{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.bar{grid-column:1/-1;position:relative;height:3px;border-radius:3px;background:var(--track);overflow:visible}
.bar i{position:absolute;inset:0;border-radius:3px;background:var(--air);transform-origin:left center;transform:scaleX(0)}
.bar u{position:absolute;top:-3px;width:1px;height:9px;background:var(--ink-3)}
.meter.hot output{color:var(--warn)} .meter.hot .bar i{background:var(--warn)}

.bottom{position:fixed;isolation:isolate;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 22px);pointer-events:none}
.hint{font-size:13.5px;color:var(--ink-2);text-align:center;max-width:36ch;line-height:1.55;transition:opacity .4s}
.hint small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.dock{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.seg{position:relative;display:flex;border-radius:999px}
.seg .knob{position:absolute;top:0;bottom:0;left:0;width:50%;border-radius:999px;background:var(--seg-active);
  box-shadow:0 2px 8px rgba(30,45,70,.12);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg[data-mode="pull"] .knob{transform:translateX(100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.seg button{position:relative;z-index:1;display:flex;white-space:nowrap;align-items:center;gap:7px;height:42px;padding:0 18px;border-radius:999px;
  font-size:14px;font-weight:500;color:var(--ink-2);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg svg,.icon svg{width:18px;height:18px;flex:none}
.sep{width:1px;height:22px;background:var(--track);margin:0 2px}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:background .2s,color .2s}
.icon:hover,.seg button:hover{color:var(--ink)}
.icon:hover{background:var(--track)}
.tune{pointer-events:auto;width:min(320px,calc(100vw - 32px));padding:14px 16px 12px;border-radius:18px;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);
  opacity:0;visibility:hidden;transform:translateY(8px) scale(.97);transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1),visibility .25s}
.tune.open{opacity:1;visibility:visible;transform:none}
.tune-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:10px}
.tune-head label{font-weight:500}
.tune-head output{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:12.5px}
.tune-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:8px}
#strength{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer;--p:50%}
#strength::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--air) var(--p),var(--track) var(--p))}
#strength::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
#strength::-moz-range-progress{height:4px;border-radius:4px;background:var(--air)}
#strength::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-8px;background:#fff;border:0;box-shadow:0 1px 4px rgba(20,30,50,.3),0 0 0 1px rgba(20,30,50,.06)}
#strength::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(20,30,50,.3)}
#strength:focus-visible{outline:none}
#strength:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--air)}
.icon[aria-expanded="true"]{background:var(--track);color:var(--ink)}
.renew{pointer-events:auto;height:46px;padding:0 22px;border-radius:999px;font-size:14.5px;font-weight:500;color:#fff;background:var(--air);
  box-shadow:0 8px 24px color-mix(in srgb,var(--air) 40%,transparent);display:flex;align-items:center;gap:8px;
  opacity:0;transform:translateY(8px) scale(.96);transition:opacity .35s,transform .45s cubic-bezier(.3,1.4,.5,1);visibility:hidden}
.renew.show{opacity:1;transform:none;visibility:visible}
.renew svg{width:17px;height:17px}
button:focus-visible{outline:2px solid var(--air);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:15px;color:var(--ink-2)}

@media (max-width:520px){
  .top{padding-left:16px;padding-right:16px}
  .meters{padding:11px 13px;gap:10px}
  .seg button{padding:0 12px;gap:5px}
  .dock{gap:2px;padding:5px}
  .icon{width:38px;height:38px}
  .seg button{height:40px}
  .seg button .lbl{font-size:13.5px}
}
@media (prefers-reduced-motion: reduce){
  .seg .knob,.renew,.count b.bump{transition:none;animation:none}
}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="10×10 뽁뽁이 시트. 누르기 모드에서는 눌러서, 당기기 모드에서는 집어당겨서 터트릴 수 있습니다. 방향키로 뽁뽁이를 고르고 스페이스바를 누르고 있으면 그 뽁뽁이를 누릅니다."></canvas>
<div class="fallback" id="fallback">이 브라우저에서는 3D 그래픽(WebGL)을 쓸 수 없어요. 최신 Chrome, Safari, Edge에서 열어주세요.</div>

<header class="top">
  <div class="brand">
    <h1>뽁뽁이 10×10</h1>
    <div class="count"><b id="left">100</b>개 남음</div>
    <div class="count total">지금까지 <span id="count">0</span>개 터트림</div>
  </div>
  <section class="meters" hidden aria-label="마지막으로 만진 뽁뽁이 상태">
    <div class="meter" id="mP"><span>내부 압력</span><output id="vP">+0.0 kPa</output><div class="bar"><i id="bP"></i><u id="mkP" style="left:73%" title="이쯤에서 터져요"></u></div></div>
    <div class="meter" id="mS"><span>막 늘어남</span><output id="vS">0%</output><div class="bar"><i id="bS"></i><u style="left:26.7%" title="이 지점부터 다시 돌아오지 않아요"></u></div></div>
  </section>
</header>

<footer class="bottom">
  <button class="renew" id="renew" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>새 시트 깔기</button>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="tune" id="tune" hidden>
    <div class="tune-head"><label for="strength">터지는 강도</label><output id="vStr" for="strength">보통</output></div>
    <input type="range" id="strength" min="0" max="100" step="1" value="50">
    <div class="tune-ends"><span>살짝 눌러도 톡</span><span>꾹 눌러야 펑</span></div>
  </div>
  <div class="dock">
    <div class="seg" id="seg" hidden data-mode="press" role="group" aria-label="터트리는 방법">
      <span class="knob"></span>
      <button type="button" id="bPress" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5v7M7 6.8 10 9.8l3-3"/><path d="M3 17.5h14"/><path d="M5.5 17.5c0-3 2-4.6 4.5-4.6s4.5 1.6 4.5 4.6"/></svg><span class="lbl">누르기</span></button>
      <button type="button" id="bPull" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10V2.8M7 5.6l3-3 3 3"/><path d="M3 17.5h14"/><path d="M5.5 17.5c0-3 2-6.2 4.5-6.2s4.5 3.2 4.5 6.2"/></svg><span class="lbl">당기기</span></button>
    </div>
    <span class="sep" hidden></span>
    <button class="icon" type="button" id="bTune" hidden aria-label="터지는 강도" aria-expanded="false" aria-controls="tune" title="터지는 강도"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 6h7M14.5 6h2M3.5 14h2M9.5 14h7"/><circle cx="12.5" cy="6" r="2"/><circle cx="7.5" cy="14" r="2"/></svg></button>
    <button class="icon" type="button" id="bSound" aria-label="소리 끄기" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5h3l4-3.5v12l-4-3.5h-3z"/><path class="w" d="M13.5 7.2a4 4 0 0 1 0 5.6M15.6 5a7 7 0 0 1 0 10"/><path class="x" d="M13.5 8l4 4M17.5 8l-4 4" style="display:none"/></svg></button>
    <button class="icon" type="button" id="bReset" aria-label="새 시트 깔기" title="새 시트 깔기 (R)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 6.5A6.5 6.5 0 1 0 16.5 10"/><path d="M16 2.8v3.9h-3.9"/></svg></button>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Soft-body bubble physics: XPBD membrane + Boyle gas + plasticity + rupture
function createBubble(opts){
  const P = Object.assign({
    R:1, H:0.76, NR:14, mass:0.01, topR:0.86, fillet:0.13, fill:1.0, crown:0.045,
    Patm:10.0, Pg0:0.06, burstGauge:1.15, burstJitter:0.08,
    compliance:0.47, compCompress:6.0, bendCompliance:3,
    postBend:8, postComp:6, collapse:1.2, collapseTau:0.11, postGravity:10, lockAfter:0.40,
    bendYield:0.02, bendCreep:1.2, postBendCreep:8, burstSet:0.95,
    damping:55, velocityDrag:30, substeps:20,
    yieldStrain:0.12, creepRate:1.7, ruptureStrain:0.48, ruptureTotal:1.8, freeRuptureStrain:0.33, freeRuptureTotal:1.42,
    crackStrain:0.14, compYield:0.06,
    leakTau:0.007,
  }, opts||{});
  const {R,H,NR}=P;
  // Thermoformed air cell: a mostly flat circular lid, rounded rim, and upright cylindrical wall.
  // Multiple profile samples keep the shoulder smooth without turning the whole cell into a hemisphere.
  const prof=[];
  const lid=R*0.76, shoulder=R*0.13;
  const steps=160;
  for(let k=0;k<=steps;k++){
    const u=k/steps;
    prof.push([lid*u,H+P.crown*(1-u*u)*(1-u*u)]);
  }
  // Quarter-rounded lip from the top film into the cylindrical side.
  for(let k=1;k<=steps;k++){
    const a=Math.PI/2-(Math.PI/2)*k/steps;
    prof.push([lid+shoulder*Math.cos(a),H-shoulder+shoulder*Math.sin(a)]);
  }
  // Nearly vertical skirt, slightly flared into the perimeter's heat seal.
  for(let k=1;k<=steps;k++){
    const u=k/steps;
    prof.push([lid+shoulder+(R-lid-shoulder)*Math.pow(u,3),
      (H-shoulder)*(1-u)]);
  }
  const arc=[0];
  for(let k=1;k<prof.length;k++){const dx=prof[k][0]-prof[k-1][0],dy=prof[k][1]-prof[k-1][1];arc.push(arc[k-1]+Math.hypot(dx,dy));}
  const Stot=arc[arc.length-1];
  function atArc(s){let lo=0,hi=arc.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(arc[m]<s)lo=m;else hi=m;}const f=(s-arc[lo])/((arc[hi]-arc[lo])||1);return [prof[lo][0]+(prof[hi][0]-prof[lo][0])*f,prof[lo][1]+(prof[hi][1]-prof[lo][1])*f];}
  const verts=[]; const rings=[];
  for(let i=0;i<=NR;i++){
    const ring=[];
    if(i===0){ring.push(verts.length);verts.push([0,prof[0][1],0]);}
    else{
      let [r,y]=atArc(Stot*i/NR); if(i===NR){r=R;y=0;}
      const n=6*i;
      for(let j=0;j<n;j++){const a=2*Math.PI*j/n + (i%2?0:Math.PI/n*0); ring.push(verts.length);verts.push([r*Math.cos(a),y,r*Math.sin(a)]);}
    }
    rings.push(ring);
  }
  const tris=[];
  // fan
  for(let j=0;j<6;j++) tris.push([rings[0][0],rings[1][j],rings[1][(j+1)%6]]);
  for(let i=2;i<=NR;i++){
    const A=rings[i-1],B=rings[i],na=A.length,nb=B.length;let a=0,b=0;
    while(a<na||b<nb){
      const ta=(a+1)/na, tb=(b+1)/nb;
      if(b>=nb || (a<na && ta<tb)){tris.push([A[a%na],A[(a+1)%na],B[b%nb]]);a++;}
      else {tris.push([A[a%na],B[(b+1)%nb],B[b%nb]]);b++;}
    }
  }
  const N=verts.length;
  const pos=new Float32Array(N*3), vel=new Float32Array(N*3), prev=new Float32Array(N*3), rest=new Float32Array(N*3);
  const invMass=new Float32Array(N), pinned=new Uint8Array(N);
  for(let i=0;i<N;i++){pos[i*3]=verts[i][0];pos[i*3+1]=verts[i][1];pos[i*3+2]=verts[i][2];}
  rest.set(pos);
  const m=P.mass/N;
  for(const v of rings[NR]) pinned[v]=1;
  for(let i=0;i<N;i++) invMass[i]=pinned[i]?0:1/m;
  // orient triangles outward
  const T=tris.length; const tri=new Uint32Array(T*3);
  for(let t=0;t<T;t++){
    let [a,b,c]=tris[t];
    const ax=pos[a*3],ay=pos[a*3+1],az=pos[a*3+2];
    const e1=[pos[b*3]-ax,pos[b*3+1]-ay,pos[b*3+2]-az], e2=[pos[c*3]-ax,pos[c*3+1]-ay,pos[c*3+2]-az];
    const n=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
    const cx=(ax+pos[b*3]+pos[c*3])/3,cy=(ay+pos[b*3+1]+pos[c*3+1])/3,cz=(az+pos[b*3+2]+pos[c*3+2])/3;
    if(n[0]*cx+n[1]*(cy+0.3)+n[2]*cz<0){const tmp=b;b=c;c=tmp;}
    tri[t*3]=a;tri[t*3+1]=b;tri[t*3+2]=c;
  }
  // edges
  const emap=new Map(); const edges=[]; const triEdges=new Int32Array(T*3);
  const edgeTris=[];
  function ek(a,b){return a<b?a*100000+b:b*100000+a;}
  for(let t=0;t<T;t++){for(let k=0;k<3;k++){const a=tri[t*3+k],b=tri[t*3+(k+1)%3];const key=ek(a,b);let id=emap.get(key);if(id===undefined){id=edges.length;emap.set(key,id);edges.push([Math.min(a,b),Math.max(a,b)]);edgeTris.push([]);}triEdges[t*3+k]=id;edgeTris[id].push(t);}}
  const E=edges.length;
  const eA=new Uint32Array(E),eB=new Uint32Array(E),eL0=new Float32Array(E),eLorig=new Float32Array(E),eBroken=new Uint8Array(E),eLen=new Float32Array(E);
  for(let e=0;e<E;e++){const [a,b]=edges[e];eA[e]=a;eB[e]=b;const L=Math.hypot(pos[a*3]-pos[b*3],pos[a*3+1]-pos[b*3+1],pos[a*3+2]-pos[b*3+2]);eL0[e]=L;eLorig[e]=L;eLen[e]=L;}
  // bending: opposite vertices across edges
  const bA=[],bB=[],bL=[],bE=[];

    const gap=0.13+0.1*(g.squeeze-0.6)/0.4+0.03;
    tipA.position.copy(c).addScaledVector(right,gap).addScaledVector(toCam,0.04);tipB.position.copy(c).addScaledVector(right,-gap).addScaledVector(toCam,0.04);
    tipA.visible=tipB.visible=true;tipUniforms.uAlpha.value=Math.min(1.4,tipUniforms.uAlpha.value+dt*6);
  } else {tipUniforms.uAlpha.value=Math.max(0,tipUniforms.uAlpha.value-dt*5);if(tipUniforms.uAlpha.value<=0)tipA.visible=tipB.visible=false;}

  for(const r of rings){if(r.t>=1){r.mesh.visible=false;continue;}if(r.delay>0){r.delay-=dt;r.m.uniforms.uAlpha.value=0;continue;}r.t=Math.min(1,r.t+dt/r.dur);r.m.uniforms.uT.value=r.t;r.m.uniforms.uAlpha.value=r.alpha;}
  for(const sh of shells){if(sh.t>=1){sh.mesh.visible=false;continue;}sh.t=Math.min(1,sh.t+dt/0.42);const e=1-Math.pow(1-sh.t,3);sh.mesh.scale.setScalar(0.12+e*(0.7+sh.power*0.35));sh.m.uniforms.uA.value=Math.pow(1-sh.t,1.5)*0.9;}
  flash.intensity*=Math.exp(-dt*14);
  // camera
  const d=cam.dist*Math.max(1,1.0/camera.aspect);
  camera.position.set(cam.target.x+d*Math.cos(cam.phi)*Math.sin(cam.theta),cam.target.y+d*Math.sin(cam.phi),cam.target.z+d*Math.cos(cam.phi)*Math.cos(cam.theta));

  const KPA=101.3/template.P.Patm;const kPa=!fb||fb.popped?0:fb.gauge*KPA;const st=!fb?(template.maxTotal||0):fb.popped?fb.popStretch:fb.maxTotal;

  vS.textContent=(fb&&fb.popped?'터질 때 ':'')+Math.max(0,dispS).toFixed(0)+'%';
  bP.style.transform=`scaleX(${THREE.MathUtils.clamp(dispP/PMAX,0,1)})`;bS.style.transform=`scaleX(${THREE.MathUtils.clamp(dispS/45,0,1)})`;
  mP.classList.toggle('hot',dispP>BURST*KPA0*0.8&&!(fb&&fb.popped));mS.classList.toggle('hot',dispS>24&&!(fb&&fb.popped));
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
if(innerWidth/innerHeight<0.8)cam.theta=0.08;
